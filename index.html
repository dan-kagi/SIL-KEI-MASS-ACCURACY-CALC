<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MASS ACCURACY CALCULATOR</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="head">
      <div>
        <h1>SIL-KEI</h1>
        <h2>MASS ACCURACY CALCULATOR</h2>
      </div>
      <img src="./public/logo.png" alt="logo" />
    </div>
    <div id="paragraph">
      <!-- <p>Enter numbers until the fourth decimal place.</p> -->
      <p>Accuracy result will be presented in ppm.</p>
    </div>

    <div id="parameters">
      <div id="inputs">
        <div>
          <label for="exact_mass">Exact mass:</label>
          <input type="text" id="exact_mass" />
        </div>
        <div>
          <label for="measured_mass">Measured mass: </label>
          <input type="text" id="measured_mass" />
        </div>
      </div>

      <button id="calculate">Calculate</button>
      <button id="clear">Clear</button>
    </div>
    <div id="output">
      <p id="returning">SIL-KEI returns:</p>
      <p id="heart"></p>
    </div>
    <footer></footer>
    <script src="./index.js"></script>
  </body>
</html>
